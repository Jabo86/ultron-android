<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>UNVOR Launcher</title><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="console.css"><link rel="stylesheet" href="app-grid.css"></head><body>
<main id="home" class="home" aria-label="Home UNVOR">
<section class="top">
 <button class="clock glass" data-action="alarms" aria-label="Apri sveglie"><strong id="clock">--:--</strong><span id="date"></span><small id="alarm">Sveglie</small></button>
 <button class="weather glass" data-action="weather" data-slot="weather" aria-label="Apri o scegli app meteo"><span class="weather-line"><span class="weather-icon" data-icon="cloud"></span><strong>Meteo</strong></span><span id="weather-app"></span><small>Apri le previsioni</small></button>
</section>
<section class="core" aria-label="Assistente vocale UNVOR">
 <div class="emitter" aria-hidden="true"><div class="orb-housing"></div><div class="orb-logo"></div><canvas id="voice-globe" width="512" height="512"></canvas></div>
 <button id="globe-voice-button" data-action="aiOpen" aria-label="Apri assistente UNVOR"></button>
 <span id="voice-label" role="status" aria-live="polite"></span>
</section>
<section class="information">
 <section class="left-stack">
  <section class="system glass"><h2>SISTEMA</h2>
   <div class="meter-row"><span class="meter-icon" data-icon="storage"></span><span class="meter-body"><span class="meter-title">CPU <b>N/D</b></span><span class="meter-track"><span></span></span></span></div>
   <button class="meter-row" data-action="system" aria-label="Informazioni memoria"><span class="meter-icon" data-icon="ram"></span><span class="meter-body"><span class="meter-title">RAM <b id="ram-value">N/D</b></span><span class="meter-track"><span id="ram-bar"></span></span></span></button>
   <button class="meter-row" data-action="battery" aria-label="Impostazioni batteria"><span class="meter-icon" data-icon="battery"></span><span class="meter-body"><span class="meter-title">BATTERIA <b id="battery-value">N/D</b></span><span class="meter-track"><span id="battery-bar"></span></span></span></button>
  </section>
  <button class="device glass" data-action="system"><span class="device-icon" data-icon="shield"></span><span><strong id="device-name">ANDROID</strong><small>Informazioni sistema</small></span></button>
 </section>
 <div class="projector" aria-hidden="true"></div>
 <section class="quick glass"><h2>ACCESSO RAPIDO</h2><div class="quick-grid"><button data-action="apps" aria-label="App"><span data-icon="apps"></span><span>App</span></button><button data-action="files" aria-label="File"><span data-icon="folder"></span><span>File</span></button><button data-action="settings" aria-label="Impostazioni"><span data-icon="settings"></span><span>Impostazioni</span></button><button data-action="privacy" aria-label="Sicurezza"><span data-icon="shield"></span><span>Sicurezza</span></button><button data-action="network" aria-label="Rete"><span data-icon="wifi"></span><span>Rete</span></button><button data-action="aiSettings" aria-label="Strumenti AI e cervelli personali"><span data-icon="helmet"></span><span>Strumenti AI</span></button></div></section></section>
<section class="search-wrap"><form id="search" class="search"><button type="button" id="toggle-search" aria-expanded="false" aria-label="Apri ricerca Internet"><span data-icon="search"></span></button><button class="voice-prompt" data-action="voice">Ehi UNVOR</button><input hidden id="query" type="search" enterkeyhint="search" autocomplete="off" placeholder="Cerca sul web…" aria-label="Cerca su Internet"><span id="search-hint" hidden></span><button type="button" data-action="voice" aria-label="Comando vocale locale"><span data-icon="mic"></span></button></form></section>
<nav class="dock" aria-label="Applicazioni principali">
<button data-action="calls" data-slot="dock0" aria-label="Chiamate"><span data-icon="phone"></span><span>Chiamate</span></button>
<button data-action="sms" data-slot="dock1" aria-label="Messaggi"><span data-icon="message"></span><span>Messaggi</span></button>
<button data-action="apps" aria-label="Tutte le app in griglia"><span data-icon="drawer"></span><span>App</span></button>
<button data-action="browser" data-slot="dock4" aria-label="Internet Tor"><span data-icon="globe"></span><span>Internet</span></button>
<button data-action="ultron" data-slot="dock3" aria-label="UNVOR Chat"><span data-icon="message"></span><span>UNVOR Chat</span></button></nav><span id="disk-value" hidden></span><span id="disk-bar" hidden></span></main>
<div id="overlay" class="overlay" hidden><section class="dialog glass" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><h1 id="dialog-title">UNVOR</h1><button id="close" aria-label="Chiudi pannello">✕</button></header><div id="dialog-content"></div></section></div><div id="toast" role="status" aria-live="polite" hidden></div><aside id="answer-box" hidden aria-label="Risposta UNVOR"><button id="answer-close" aria-label="Chiudi risposta">×</button><p id="answer-text"></p></aside><script src="globe-voice.js"></script><script src="home.js"></script></body></html>
