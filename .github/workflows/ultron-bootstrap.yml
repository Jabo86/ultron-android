name: Bootstrap independent ULTRON Android repository
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ultron-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out independent destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import Lattice-derived ULTRON branch as source files (not Git history)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 'ultron/android-migration' https://github.com/Jabo86/lattice-android.git /tmp/ultron-upstream
          rsync -a --exclude='.git' --exclude='.github/workflows/export-ultron-project.yml' --exclude='google-services.json' --exclude='android/app/google-services.json' /tmp/ultron-upstream/ ./
          rm -f .github/workflows/export-ultron-project.yml
          cat > README.md <<'EOF'
          # ULTRON Android
          
          Progetto indipendente ricavato dai sorgenti di Lattice Android.
          
          Repository originale: https://github.com/Jabo86/lattice-android
          
          ULTRON e Lattice sono repository separati. Tutte le modifiche successive a questa importazione vanno applicate **solo** qui.
          
          ## Stato
          - Base Android React Native + Kotlin importata con i componenti di messaggistica e cifratura esistenti.
          - Rimossa l'integrazione diretta Firebase/FCM nella migrazione iniziale.
          - Servizio notifiche ULTRON WakeService predisposto per `49.12.242.0`.
          - Il server HTTPS e le notifiche end-to-end richiedono ancora verifica funzionale.
          - L'APK di debug non rappresenta una release di produzione.
          
          ## Build
          La pipeline `.github/workflows/ultron-android-apk.yml` compila e controlla le dipendenze. Non inserire chiavi o certificati privati nel repository.
          EOF
          cat > ULTRON_MIGRATION_STATUS.md <<'EOF'
          # ULTRON Android — stato verificabile
          
          - Repository GitHub indipendente da Lattice.
          - Codice importato dalla branch `ultron/android-migration` di `Jabo86/lattice-android`.
          - Clone senza la storia Git originale e con un primo commit autonomo.
          - Il nome del bundle Android è `com.ultron.messenger`; il namespace Kotlin originale resta compatibile.
          - Verificare branding grafico e riferimenti Lattice prima della release.
          - Non è stata verificata l'API HTTPS notifiche sul server `49.12.242.0`.
          - I controlli npm non sono una verifica di sicurezza crittografica né del backend.
          EOF
          node tools/verify-ultron-notifications.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import independent ULTRON Android source tree with native notifications and CI'
          git push origin HEAD:main
      - name: Summarize copied contents
        run: |
          echo "Tracked files: $(git ls-files | wc -l)"
          git log --oneline -2
