name: ULTRON Android APK (verification)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006"
      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: Install JS dependencies
        run: |
          npm ci --legacy-peer-deps --no-fund
          npm audit --audit-level=low
      - name: Verify proprietary notification routing
        run: node tools/verify-ultron-notifications.cjs
      - name: Build native Xray AAR from checked-in source
        run: bash tools/build-libv2ray.sh "$GITHUB_WORKSPACE/third_party/libxray" "$GITHUB_WORKSPACE/android/app/libs/libv2ray.aar"
      - name: Generate temporary debug key (never a production signing key)
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -storepass android -keypass android -dname "CN=ULTRON debug,O=Development,C=IT"
      - name: Compile standalone Android verification APK
        working-directory: android
        run: |
          test ! -e keystore.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify app ID, embedded JavaScript and APK signature
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          unzip -Z1 "$apk" | awk '$0 == "assets/index.android.bundle" { found=1 } END { exit !found }'
          test "$("$tools/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")" = com.ultron.messenger
          "$tools/apksigner" verify "$apk"
          mkdir -p dist
          cp "$apk" dist/ULTRON-Android-verification.apk
          sha256sum dist/ULTRON-Android-verification.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ULTRON-Android-verification
          path: dist/ULTRON-Android-verification.apk
          if-no-files-found: error
