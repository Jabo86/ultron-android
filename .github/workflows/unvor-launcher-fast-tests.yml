name: UNVOR Launcher fast-app regression
on:
  push:
    branches: [fix/unvor-launcher-fast-apps]
    paths:
      - "unvor-launcher/**"
      - ".github/workflows/unvor-launcher-fast-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check packaged HUD JavaScript
        run: node --check unvor-launcher/UNVORLauncher/app/src/main/assets/hud/home.js
      - name: Guard low-latency app launch paths
        run: node unvor-launcher/test-tools/fast-apps-test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile real Launcher Home, AI engine, and agenda against Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
            if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager missing"; exit 1; fi
            yes | "$SDKMANAGER" --install "platforms;android-35" >/dev/null || true
          fi
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p "$RUNNER_TEMP/unvor-ai-classes"
          javac -source 8 -target 8 -encoding UTF-8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$RUNNER_TEMP/unvor-ai-classes" \
            unvor-launcher/UNVORLauncher/app/src/main/java/com/ultron/launcher/MainActivity.java \
            unvor-launcher/UNVORLauncher/app/src/main/java/com/ultron/launcher/PersonalAi.java \
            unvor-launcher/UNVORLauncher/app/src/main/java/com/ultron/launcher/AgendaStore.java \
            unvor-launcher/UNVORLauncher/app/src/main/java/com/ultron/launcher/AgendaAlarmService.java \
            unvor-launcher/UNVORLauncher/app/src/main/java/com/ultron/launcher/AgendaReceiver.java \
            unvor-launcher/UNVORLauncher/app/src/main/java/com/ultron/launcher/LocalCommands.java \
            unvor-launcher/UNVORLauncher/app/src/main/java/com/ultron/launcher/VoiceSelection.java \
            unvor-launcher/test-tools/stubs/com/ultron/launcher/OfflineVoice.java
