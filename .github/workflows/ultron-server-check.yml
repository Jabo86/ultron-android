name: ULTRON server reachability (non-destructive)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect HTTPS and wake API without secrets
        shell: bash
        run: |
          set -u
          origin=https://49.12.242.0
          failures=0
          probe() {
            local label=$1 expected=$2 code
            shift 2
            if ! code=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$@"); then
              echo "::error::$label: errore HTTPS o timeout"
              failures=$((failures + 1))
            elif [[ "$code" != "$expected" ]]; then
              echo "::error::$label: HTTP $code, atteso $expected"
              failures=$((failures + 1))
            else
              echo "$label: HTTP $code"
            fi
          }
          probe "Gateway HTTPS" 200 "$origin/api/health"
          probe "Chat autenticata" 401 "$origin/api/public/pulse/conversations"
          probe "Esportazione autenticata" 401 "$origin/api/public/account/export"
          probe "Eventi chat autenticati" 401 "$origin/api/public/pulse/message-events?conv_id=0&after=0"
          probe "Allegati autenticati" 401 -H 'Content-Type: application/json' -d '{}' "$origin/api/public/blob/init"
          probe "Stati autenticati" 401 "$origin/api/public/pulse/status"
          probe "Credenziali TURN autenticate" 401 "$origin/api/public/pulse/turn"
          echo "Controllo pubblico delle rotte. La consegna, gli allegati e l’audio richiedono prove con due account."
          test "$failures" -eq 0
