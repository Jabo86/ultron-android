name: UNVOR MLS invite compatibility audit
on:
  push:
    branches:
      - fix/unvor-pilot-366-groups
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual bundled gateway invitation routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gateway"
          tar -xzf tools/gateway-attachments/source.tar.gz -C "$RUNNER_TEMP/gateway"
          python3 - "$RUNNER_TEMP/gateway" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          for p in root.rglob('*.rs'):
              if p.name not in ('group_control.rs','group_invites.rs','group_routes.rs','group_mls.rs'): continue
              lines=p.read_text(errors='replace').splitlines()
              print('SOURCE', p.relative_to(root), 'lines', len(lines))
              for i,line in enumerate(lines):
                  if re.search(r'(?i)\\b(fn|struct|enum) (redeem|review|request|link|decide|control|redeem_link)|action\\s*==\\s*"link"|link_code|invitation',line):
                      print(f'  {i+1}: {line[:180]}')
              if p.name=='group_invites.rs':
                  print('GROUP_INVITES_SOURCE_BEGIN')
                  for i,line in enumerate(lines[:200]): print(f'{i+1}: {line[:240]}')
                  print('GROUP_INVITES_SOURCE_END')
          PY
