name: UNVOR MLS invite compatibility audit
on:
  push:
    branches:
      - fix/unvor-pilot-366-groups
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual bundled gateway invitation routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gateway"
          tar -xzf tools/gateway-attachments/source.tar.gz -C "$RUNNER_TEMP/gateway"
          python3 - "$RUNNER_TEMP/gateway" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          rx=re.compile(r'(?i)mls.*redeem|redeem.*mls|invitation.*review|review.*invitation|action.*link|link.*action|group.*invitations|redeem_link|create_invitation|review_invitation')
          for p in root.rglob('*.rs'):
              lines=p.read_text(errors='replace').splitlines()
              matches=[i for i,line in enumerate(lines) if rx.search(line)]
              if not matches: continue
              print('SOURCE',p.relative_to(root),'matches',len(matches))
              for i in matches[:35]:
                  print(f'  {i+1}: {lines[i][:200]}')
          PY
